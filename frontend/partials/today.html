<div class="view-container" x-data="todayView()">
  <h2>Heute</h2>
  
  <section class="task-section">
    <h3>Tägliche Mini-Routine</h3>
    <div class="task-list">
      <template x-for="task in dailyTasks" :key="task.id">
        <div class="task-item" :class="{ 'completed': task.completed }">
          <label class="task-label">
            <input 
              type="checkbox" 
              :checked="task.completed"
              @change="toggleTask(task)"
              class="task-checkbox">
            <span class="task-emoji" x-text="task.emoji"></span>
            <span class="task-name" x-text="task.name"></span>
          </label>
          <small x-show="task.completed" x-text="formatTime(task.completed_at)"></small>
        </div>
      </template>
    </div>
  </section>

  <section class="task-section" x-show="todayZone">
    <h3><span x-text="todayZone?.emoji"></span> <span x-text="todayZone?.name"></span></h3>
    <div class="task-list">
      <template x-for="task in zoneTasks" :key="task.id">
        <div class="task-item" :class="{ 'completed': task.completed }">
          <label class="task-label">
            <input 
              type="checkbox" 
              :checked="task.completed"
              @change="toggleTask(task)"
              class="task-checkbox">
            <span class="task-emoji" x-text="task.emoji"></span>
            <span class="task-name" x-text="task.name"></span>
          </label>
          <small x-show="task.completed" x-text="formatTime(task.completed_at)"></small>
        </div>
      </template>
    </div>
  </section>

  <section class="task-section" x-show="nextRotatingTask">
    <h3>✨ Nächste große Aufgabe</h3>
    <div class="task-list">
      <div class="task-item highlight" :class="{ 'completed': nextRotatingTask?.completed }">
        <label class="task-label">
          <input 
            type="checkbox" 
            :checked="nextRotatingTask?.completed"
            @change="toggleTask(nextRotatingTask)"
            class="task-checkbox">
          <span class="task-emoji" x-text="nextRotatingTask?.emoji"></span>
          <span class="task-name" x-text="nextRotatingTask?.name"></span>
        </label>
      </div>
    </div>
  </section>

  <div x-show="loading" class="loading">Lädt...</div>
</div>

<script>
function todayView() {
  return {
    dailyTasks: [],
    zoneTasks: [],
    todayZone: null,
    nextRotatingTask: null,
    loading: true,
    
    init() {
      this.loadTasks();
    },
    
    async loadTasks() {
      try {
        const today = new Date().getDay();
        
        const [tasksResp, zonesResp] = await Promise.all([
          fetch('/api/collections/tasks/records?perPage=100'),
          fetch('/api/collections/zones/records?perPage=10')
        ]);
        
        const tasks = await tasksResp.json();
        const zones = await zonesResp.json();
        
        this.dailyTasks = tasks.items.filter(t => t.is_daily);
        this.todayZone = zones.items.find(z => z.weekday === today);
        
        if (this.todayZone) {
          this.zoneTasks = tasks.items.filter(t => t.zone === this.todayZone.id);
        }
        
        const rotatingTasks = tasks.items.filter(t => !t.is_daily && !t.completed)
          .sort((a, b) => a.sort_order - b.sort_order);
        this.nextRotatingTask = rotatingTasks[0] || null;
        
        this.loading = false;
      } catch (err) {
        console.error('Failed to load tasks:', err);
        this.loading = false;
      }
    },
    
    async toggleTask(task) {
      try {
        const newCompleted = !task.completed;
        const response = await fetch(`/api/collections/tasks/records/${task.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            completed: newCompleted,
            completed_at: newCompleted ? new Date().toISOString() : ''
          })
        });
        
        if (response.ok) {
          task.completed = newCompleted;
          task.completed_at = newCompleted ? new Date().toISOString() : '';
          this.loadTasks();
        }
      } catch (err) {
        console.error('Failed to toggle task:', err);
      }
    },
    
    formatTime(timestamp) {
      if (!timestamp) return '';
      const date = new Date(timestamp);
      return date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    }
  };
}
</script>
