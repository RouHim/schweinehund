name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Build, Push, and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release (dry-run to get version)
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # Run semantic-release in dry-run mode and capture output
          npx semantic-release --dry-run > /tmp/semantic-output.txt 2>&1 || true
          cat /tmp/semantic-output.txt
          
          # Check if a new release will be created
          if grep -q "There is no previous release" /tmp/semantic-output.txt || grep -q "The next release version is" /tmp/semantic-output.txt; then
            VERSION=$(grep -oP "(?<=The next release version is )\S+" /tmp/semantic-output.txt | head -1 | tr -d '\n')
            if [ -z "$VERSION" ]; then
              # First release case
              VERSION=$(grep -oP "(?<=next release version is )\S+" /tmp/semantic-output.txt | head -1 | tr -d '\n')
            fi
            if [ -n "$VERSION" ]; then
              echo "version=$VERSION" >> $GITHUB_OUTPUT
              echo "new_release=true" >> $GITHUB_OUTPUT
              echo "✅ Next version will be: $VERSION"
            else
              echo "new_release=false" >> $GITHUB_OUTPUT
              echo "❌ Could not determine version"
            fi
          else
            echo "new_release=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No new release needed (no relevant commits)"
          fi

      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Create GitHub Release
        if: steps.semantic.outputs.new_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release
