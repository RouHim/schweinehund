name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Build, Push, and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release (dry-run to get version)
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # Run semantic-release in dry-run mode and capture output
          npx semantic-release --dry-run > /tmp/semantic-output.txt 2>&1 || true
          cat /tmp/semantic-output.txt
          
          # Check if a new release will be created
          if grep -q "There is no previous release" /tmp/semantic-output.txt || grep -q "The next release version is" /tmp/semantic-output.txt; then
            VERSION=$(grep -oP "(?<=The next release version is )\S+" /tmp/semantic-output.txt | head -1 | tr -d '\n')
            if [ -z "$VERSION" ]; then
              # First release case
              VERSION=$(grep -oP "(?<=next release version is )\S+" /tmp/semantic-output.txt | head -1 | tr -d '\n')
            fi
            if [ -n "$VERSION" ]; then
              echo "version=$VERSION" >> $GITHUB_OUTPUT
              echo "new_release=true" >> $GITHUB_OUTPUT
              echo "✅ Next version will be: $VERSION"
            else
              echo "new_release=false" >> $GITHUB_OUTPUT
              echo "❌ Could not determine version"
            fi
          else
            echo "new_release=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No new release needed (no relevant commits)"
          fi

      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./pocketbase
          file: ./pocketbase/Dockerfile
          push: true
          tags: |
            rouhim/schweinehund-pocketbase:latest
            rouhim/schweinehund-pocketbase:v${{ steps.semantic.outputs.version }}
            rouhim/schweinehund-pocketbase:${{ github.sha }}
          cache-from: type=registry,ref=rouhim/schweinehund-pocketbase:latest
          cache-to: type=inline

      - name: Create GitHub Release
        if: steps.semantic.outputs.new_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release
