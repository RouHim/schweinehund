name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Build, Push, and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          npx semantic-release --dry-run > /tmp/semantic-output.txt 2>&1 || true
          if grep -q "The next release version is" /tmp/semantic-output.txt; then
            VERSION=$(grep "The next release version is" /tmp/semantic-output.txt | sed 's/.*The next release version is //' | tr -d '\n')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "new_release=true" >> $GITHUB_OUTPUT
            echo "Next version will be: $VERSION"
          else
            echo "new_release=false" >> $GITHUB_OUTPUT
            echo "No new release needed"
          fi

      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: ./pocketbase
          file: ./pocketbase/Dockerfile
          push: true
          tags: |
            rouhim/schweinehund-pocketbase:latest
            rouhim/schweinehund-pocketbase:v${{ steps.semantic.outputs.version }}
            rouhim/schweinehund-pocketbase:${{ github.sha }}
          cache-from: type=registry,ref=rouhim/schweinehund-pocketbase:latest
          cache-to: type=inline

      - name: Create GitHub Release
        if: steps.semantic.outputs.new_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release
