version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    image: schweinehund-backend:local
    container_name: schweinehund-backend
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - DATABASE_URL=sqlite:/app/data/schweinehund.sqlite
      - NTFY_URL=http://ntfy:80/schweinehund
    volumes:
      - ./data:/app/data
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://127.0.0.1:8090/api/health", "-O", "-"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - schweinehund-net

  # ntfy - Push notification service
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: schweinehund-ntfy
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://schweinehund.local:8091}
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache/cache.db
      - NTFY_WEB_ROOT=app
    volumes:
      - ./ntfy/cache:/var/lib/ntfy/cache
    ports:
      - "8091:80"
    command: serve
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://localhost:80/v1/health", "-O", "-"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - schweinehund-net

networks:
  schweinehund-net:
    driver: bridge
