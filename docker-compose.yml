version: '3.9'

services:
  # PocketBase - Go backend with built-in SQLite database
  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    image: schweinehund-pocketbase:local
    container_name: schweinehund-pocketbase
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - POCKETBASE_DEBUG=false
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY:-default-encryption-key-change-in-production}
    volumes:
      - ./pocketbase/pb_data:/pb/pb_data
      - ./pocketbase/pb_hooks:/pb/pb_hooks
      - ./pocketbase/pb_migrations:/pb/pb_migrations
      - ./frontend:/pb/pb_public:ro
    ports:
      - "8090:8090"
    entrypoint: ["/usr/local/bin/pocketbase"]
    command: ["serve", "--http=0.0.0.0:8090", "--publicDir=/pb/pb_public"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://localhost:8090/api/health", "-O", "-"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - schweinehund-net

  # ntfy - Push notification service
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: schweinehund-ntfy
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://schweinehund.local:8091}
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache/cache.db
      - NTFY_WEB_ROOT=app
    volumes:
      - ./ntfy/cache:/var/lib/ntfy/cache
    ports:
      - "8091:80"
    command: serve
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://localhost:80/v1/health", "-O", "-"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - schweinehund-net

networks:
  schweinehund-net:
    driver: bridge
