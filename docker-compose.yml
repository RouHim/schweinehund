version: '3.9'

services:
  # PocketBase - Go backend with built-in SQLite database
  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    image: schweinehund-pocketbase:local
    container_name: schweinehund-pocketbase
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - POCKETBASE_DEBUG=false
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY:-default-encryption-key-change-in-production}
    volumes:
      - ./pocketbase/pb_data:/pb/pb_data
      - ./pocketbase/pb_hooks:/pb/pb_hooks
      - ./pocketbase/pb_migrations:/pb/pb_migrations
    ports:
      - "8090:8090"
    entrypoint: ["/usr/local/bin/pocketbase"]
    command: ["serve", "--http=0.0.0.0:8090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://localhost:8090/api/health", "-O", "-"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - schweinehund-net

  # Caddy - Reverse proxy with HTTPS termination
  caddy:
    image: caddy:2-alpine@sha256:d266901f6e0c9d74528463654b7e872e6af8f6bbe23ca13576a1fb601202f8da
    container_name: schweinehund-caddy
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - DOMAIN=${DOMAIN:-schweinehund.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/schweinehund.local.crt:/etc/caddy/certs/schweinehund.local.crt:ro
      - ./certs/schweinehund.local.key:/etc/caddy/certs/schweinehund.local.key:ro
      - ./frontend:/app/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "8080:80"
      - "8443:443"
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://localhost:8080/", "-O", "-"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - schweinehund-net
    depends_on:
      pocketbase:
        condition: service_healthy

  # ntfy - Push notification service
  ntfy:
    image: binwiederhier/ntfy:latest@sha256:115357a63dd35e3d08ad03c93ade7d7eef63761726572b809da13f2999f1958f
    container_name: schweinehund-ntfy
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://schweinehund.local:8091}
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache/cache.db
      - NTFY_WEB_ROOT=app
    volumes:
      - ./ntfy/cache:/var/lib/ntfy/cache
    ports:
      - "8091:80"
    command: serve
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://localhost:80/v1/health", "-O", "-"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - schweinehund-net

networks:
  schweinehund-net:
    driver: bridge

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
