[package]
name = "schweinehund"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
warp = "0.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "migrate"] }
chrono = "0.4"

# HTTP client for ntfy
ureq = "2.10"

# Static file embedding
rust-embed = { version = "8.4", features = ["debug-embed"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MIME type detection
mime_guess = "2.0"

[profile.release]
opt-level = 3
lto = true
