<div class="view-container" x-data="tasksView()">
  <h2>Alle Aufgaben</h2>
  
  <section class="task-section">
    <h3>Tägliche Aufgaben</h3>
    <div class="task-list">
      <template x-for="task in dailyTasks" :key="task.id">
        <div class="task-item" :class="{ 'completed': task.completed }">
          <label class="task-label">
            <input 
              type="checkbox" 
              :checked="task.completed"
              @change="toggleTask(task)"
              class="task-checkbox">
            <span class="task-emoji" x-text="task.emoji"></span>
            <span class="task-name" x-text="task.name"></span>
          </label>
          <button @click="openEditModal(task)" class="btn-sm">✏️</button>
        </div>
      </template>
    </div>
  </section>

  <section class="task-section">
    <h3>Wöchentliche Aufgaben</h3>
    <div class="task-list">
      <template x-for="task in weeklyTasks" :key="task.id">
        <div class="task-item" :class="{ 'completed': task.completed }">
          <label class="task-label">
            <input 
              type="checkbox" 
              :checked="task.completed"
              @change="toggleTask(task)"
              class="task-checkbox">
            <span class="task-emoji" x-text="task.emoji"></span>
            <span class="task-name" x-text="task.name"></span>
          </label>
          <button @click="openEditModal(task)" class="btn-sm">✏️</button>
        </div>
      </template>
    </div>
  </section>

  <button @click="openEditModal(null)" class="btn-primary">+ Neue Aufgabe</button>

  <div x-show="loading" class="loading">Lädt...</div>
</div>

<script>
function tasksView() {
  return {
    dailyTasks: [],
    weeklyTasks: [],
    loading: true,
    
    init() {
      this.loadTasks();
    },
    
     async loadTasks() {
       try {
         const response = await fetch('/api/tasks');
        const data = await response.json();
        
        this.dailyTasks = data.items.filter(t => t.is_daily);
        this.weeklyTasks = data.items.filter(t => !t.is_daily);
        this.loading = false;
      } catch (err) {
        console.error('Failed to load tasks:', err);
        this.loading = false;
      }
    },
    
    async toggleTask(task) {
      try {
        const newCompleted = !task.completed;
         const response = await fetch(`/api/tasks/${task.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            completed: newCompleted,
            completed_at: newCompleted ? new Date().toISOString() : ''
          })
        });
        
        if (response.ok) {
          task.completed = newCompleted;
          task.completed_at = newCompleted ? new Date().toISOString() : '';
        }
      } catch (err) {
        console.error('Failed to toggle task:', err);
      }
    },
    
    openEditModal(task) {
      window.dispatchEvent(new CustomEvent('open-task-modal', { detail: task }));
    }
  };
}
</script>
