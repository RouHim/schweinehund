<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dog body -->
  <ellipse cx="100" cy="110" rx="45" ry="50" fill="#FF7F50"/>
  
  <!-- Dog head -->
  <circle cx="100" cy="50" r="35" fill="#FF7F50"/>
  
  <!-- Left ear -->
  <ellipse cx="75" cy="25" rx="12" ry="20" fill="#FF7F50"/>
  
  <!-- Right ear -->
  <ellipse cx="125" cy="25" rx="12" ry="20" fill="#FF7F50"/>
  
  <!-- Eyes (sleepy/tired) -->
  <circle cx="90" cy="45" r="4" fill="#333"/>
  <circle cx="110" cy="45" r="4" fill="#333"/>
  
  <!-- Sleepy eye marks (curved lines) -->
  <path d="M 85 50 Q 90 52 95 50" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 105 50 Q 110 52 115 50" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Mouth (lazy smile) -->
  <path d="M 95 60 Q 100 63 105 60" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Tongue -->
  <ellipse cx="100" cy="68" rx="5" ry="6" fill="#FF6B9D"/>
  
  <!-- Front left leg -->
  <rect x="75" y="155" width="12" height="35" rx="6" fill="#FF7F50"/>
  
  <!-- Front right leg -->
  <rect x="113" y="155" width="12" height="35" rx="6" fill="#FF7F50"/>
  
  <!-- Back left leg (visible) -->
  <rect x="60" y="155" width="10" height="35" rx="5" fill="#FF7F50" opacity="0.8"/>
  
  <!-- Back right leg (visible) -->
  <rect x="130" y="155" width="10" height="35" rx="5" fill="#FF7F50" opacity="0.8"/>
  
  <!-- Tail -->
  <path d="M 140 100 Q 160 95 165 75" stroke="#FF7F50" stroke-width="14" fill="none" stroke-linecap="round"/>
  
  <!-- Broom handle -->
  <rect x="35" y="90" width="6" height="110" fill="#8B6914" rx="3"/>
  
  <!-- Broom bristles -->
  <g fill="#40E0D0">
    <!-- Left bristles -->
    <path d="M 35 200 L 28 210 L 30 220 L 40 215 Z"/>
    <path d="M 35 200 L 25 215 L 22 225 L 35 220 Z"/>
    <path d="M 35 200 L 32 220 L 20 225 L 25 210 Z"/>
    
    <!-- Center bristles -->
    <path d="M 38 200 L 35 215 L 32 228 L 45 225 Z"/>
    <path d="M 38 200 L 40 220 L 35 232 L 48 228 Z"/>
    <path d="M 38 200 L 42 215 L 38 230 L 50 222 Z"/>
    
    <!-- Right bristles -->
    <path d="M 41 200 L 48 215 L 45 228 L 38 220 Z"/>
    <path d="M 41 200 L 50 210 L 55 220 L 45 215 Z"/>
    <path d="M 41 200 L 52 215 L 58 223 L 48 218 Z"/>
  </g>
  
  <!-- Pink cheeks for cute factor -->
  <circle cx="65" cy="55" r="8" fill="#FF6B9D" opacity="0.5"/>
  <circle cx="135" cy="55" r="8" fill="#FF6B9D" opacity="0.5"/>
</svg>
